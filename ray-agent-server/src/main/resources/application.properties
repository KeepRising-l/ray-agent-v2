# 登录尚未接入，开发阶段后端默认只监听本机。
server.address=127.0.0.1

# 本地调用记录写入被 Git 忽略的日志目录；不记录聊天内容或密钥。
logging.file.name=logs/ray-agent.log

# 可选本机配置放在工程根目录，不提交到 Git。
spring.config.import=optional:file:./application-local.properties

# PostgreSQL 连接仅配置在根目录的 application-local.properties 或环境变量中。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:db/migration/V004__knowledge_document.sql,classpath:db/migration/V005__document_chunk_vector.sql,classpath:db/migration/V006__knowledge_chat_lifecycle.sql,classpath:db/migration/V007__context_and_user_questions.sql,classpath:db/migration/V008__run_queue_and_document_attempts.sql
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
ray.knowledge.storage-root=./.ray-data/documents
ray.run.timeout-ms=60000
ray.local.owner-id=local-owner

# 摘要阈值使用本地保守估算；原历史始终保留。
ray.context.compaction-trigger=14000
ray.context.keep-recent-turns=4
ray.question.ttl-ms=86400000

# 异步Flow占用运行槽直到完成/取消/等待用户；队列容量不含正在执行的槽。
ray.run.max-concurrent=2
ray.run.queue-capacity=8
ray.run.max-per-owner=0
ray.run.queue-timeout-ms=30000

ray.document.max-auto-retries=2
ray.document.retry-backoff-ms=1000
