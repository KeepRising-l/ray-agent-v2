name: ray-agent-v2
services:
  db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: ray_agent_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RAY_DB_PASSWORD:?Set a private RAY_DB_PASSWORD in deploy/.env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d ray_agent_v2"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:${RAY_HTTP_PORT:-8080}:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ray_agent_v2
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${RAY_DB_PASSWORD:?Set a private RAY_DB_PASSWORD in deploy/.env}
      SPRING_CONFIG_IMPORT: optional:file:/app/config/application-local.properties
    volumes:
      - data:/app/.ray-data
      - logs:/app/logs
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
volumes:
  database:
  data:
  logs:
